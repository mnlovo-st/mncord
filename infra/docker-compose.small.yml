# Extra settings for the tiny free VM (E2.1.Micro: 1 GB RAM). Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.small.yml --env-file .env up -d --build
# setup-oracle.sh also adds 2 GB of swap so a build or a burst never kills the box.
services:
  postgres:
    command: >
      postgres
      -c shared_buffers=48MB
      -c effective_cache_size=192MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=25
      -c wal_buffers=4MB
    deploy: { resources: { limits: { memory: 320M } } }
  server:
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      UV_THREADPOOL_SIZE: "2" # image re-encoding uses this pool; keep it small on 1 core
    deploy: { resources: { limits: { memory: 420M } } }
  caddy:
    deploy: { resources: { limits: { memory: 96M } } }
